<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-label="Craftsmanship image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="0.6" stop-color="#1a1612"/>
      <stop offset="1" stop-color="#0f1011"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e0b0"/>
      <stop offset="0.45" stop-color="#caa24d"/>
      <stop offset="1" stop-color="#8f6a1b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <rect width="1400" height="1400" fill="url(#bg)"/>

  <!-- Abstract bench -->
  <g filter="url(#shadow)">
    <rect x="180" y="840" width="1040" height="220" rx="42" fill="#0b0c0e" fill-opacity="0.75"/>
    <rect x="220" y="880" width="960" height="140" rx="36" fill="#141217" fill-opacity="0.9"/>
  </g>

  <!-- Abstract tools -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 740c130-140 250-220 360-240" stroke="url(#gold)" stroke-width="22" opacity="0.9"/>
    <path d="M710 500c120 20 230 90 340 210" stroke="#f3e0b0" stroke-width="14" opacity="0.45"/>
    <path d="M480 660l140 140" stroke="#ffffff" stroke-width="10" opacity="0.15"/>
    <path d="M610 600l220 220" stroke="#ffffff" stroke-width="10" opacity="0.10"/>
  </g>

  <!-- Gem -->
  <g transform="translate(880 620)" filter="url(#shadow)">
    <path d="M0 90L70 0h150l70 90-145 180z" fill="#0e0f12" opacity="0.95"/>
    <path d="M70 0l75 90L0 90z" fill="#ffffff" opacity="0.08"/>
    <path d="M220 0l-75 90 145 0z" fill="#ffffff" opacity="0.06"/>
    <path d="M145 90l75 90-75 90-75-90z" fill="url(#gold)" opacity="0.35"/>
    <path d="M145 90l-75 90h150z" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- Ambient glow -->
  <g filter="url(#soft)">
    <circle cx="520" cy="520" r="240" fill="#caa24d" opacity="0.12"/>
    <circle cx="980" cy="420" r="200" fill="#f3e0b0" opacity="0.07"/>
  </g>
</svg>
