<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-label="Bracelets category image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f10"/>
      <stop offset="0.55" stop-color="#1a1713"/>
      <stop offset="1" stop-color="#0f0f10"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="35%" r="60%">
      <stop offset="0" stop-color="#caa24d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#caa24d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect width="1200" height="1600" fill="url(#glow)"/>

  <!-- Minimal bracelet rings -->
  <g fill="none" stroke-linecap="round">
    <circle cx="520" cy="820" r="310" stroke="#caa24d" stroke-opacity="0.9" stroke-width="18"/>
    <circle cx="660" cy="760" r="250" stroke="#f3e0b0" stroke-opacity="0.55" stroke-width="10"/>
    <circle cx="600" cy="900" r="210" stroke="#caa24d" stroke-opacity="0.35" stroke-width="8"/>
  </g>

  <!-- Highlights -->
  <g filter="url(#soft)">
    <circle cx="410" cy="640" r="34" fill="#fff" fill-opacity="0.15"/>
    <circle cx="820" cy="640" r="26" fill="#fff" fill-opacity="0.10"/>
    <circle cx="760" cy="1040" r="28" fill="#fff" fill-opacity="0.08"/>
  </g>

  <!-- Subtle grain -->
  <g opacity="0.08">
    <path d="M0 260c200 120 360 120 520 0s340-120 680 0v80c-220-120-420-120-680 0S220 420 0 340z" fill="#ffffff"/>
    <path d="M0 1280c220 120 420 120 680 0s340-120 520 0v90c-200-120-360-120-520 0s-340 120-680 0z" fill="#ffffff"/>
  </g>
</svg>
